# ==============================================================================
# Konfigurasi Nginx Virtual Host - Cloud Drive (OortCloud)
# Lokasi di Server: /etc/nginx/sites-available/oortcloud
# Reverse Proxy ke Node.js Web Client (Port 4000)
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Tangkap semua request yang masuk menggunakan IP Address server
    server_name _;

    # Bebaskan batasan ukuran unggah file (0 = unlimited / tidak terbatas)
    client_max_body_size 0;

    # Timeout transfer untuk mendukung unggah dan unduh berkas berukuran besar
    client_body_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # Kompresi Gzip untuk mempercepat pengiriman aset statis (HTML, CSS, JS, JSON)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security Headers Standar
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Log Akses dan Error
    access_log /var/log/nginx/oortcloud_access.log;
    error_log /var/log/nginx/oortcloud_error.log warn;

    # Lokasi Routing Utama -> Reverse Proxy ke Express Web Client Port 4000
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Header Koneksi & Real IP Forwarding
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Matikan buffering agar unggah & unduh berkas besar langsung di-stream
        proxy_request_buffering off;
        proxy_buffering off;

        # Nonaktifkan redirect otomatis dari backend port
        proxy_redirect off;
    }

    # Blokir akses ke file tersembunyi (seperti .git atau .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
